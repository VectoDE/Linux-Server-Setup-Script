version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # New releases wait a week, so a compromised release is usually pulled before it reaches CI.
    cooldown:
      default-days: 7
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ['*']

  # Test images, pinned by digest. A new release of a distribution (debian 12 -> 13) is a new matrix entry, not an
  # update, so major versions are ignored.
  - package-ecosystem: docker
    directories:
      - /tests/integration/images/almalinux-10
      - /tests/integration/images/debian-12
      - /tests/integration/images/debian-13
      - /tests/integration/images/rocky-9
      - /tests/integration/images/ubuntu-22.04
      - /tests/integration/images/ubuntu-24.04
      - /tests/integration/images/ubuntu-26.04
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies, docker]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      images:
        patterns: ['*']

  # Python tools of the Ansible collection checks (tests/ansible/requirements.txt, pinned with hashes).
  - package-ecosystem: pip
    directory: /tests/ansible
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies, ci]
    groups:
      ansible:
        patterns: ['*']
