name: Feature request
description: Suggest a module, a setting or support for another distribution.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which problem does this solve?
      description: What do you set up by hand today, and what is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The module or setting you have in mind, its defaults and what it should change on the server.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you tried
