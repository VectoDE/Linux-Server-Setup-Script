# Installs every module on every supported distribution: install, verify, install again without a change, remove.
# Containers run systemd as PID 1; modules that change the kernel (firewall, swap, sysctl, ...) run on the runner
# virtual machine itself, which is thrown away afterwards. Everything runs on x86_64 and on arm64 (aarch64).
name: Integration

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: ${{ matrix.system }}${{ matrix.arch == 'arm64' && ' arm64' || '' }} / ${{ matrix.group }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        system: [debian-12, debian-13, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, rocky-9, almalinux-10]
        group: [base, security, scanners, web, runtime, database, database-alt, container, backup, backup-alt, monitoring, network, mail, apps]
        arch: [x64, arm64]
        include:
          - group: base
            modules: system time admin-user tools logging
          - group: security
            modules: ssh-hardening ssh-2fa fail2ban crowdsec password-policy auto-updates guard
          - group: scanners
            modules: aide rkhunter clamav lynis
          # Each web server alone, then with certificates (Pebble) and sites; then HAProxy.
          - group: web
            modules: nginx,tls,vhost apache,tls,vhost caddy,tls,vhost haproxy nginx,modsecurity apache,modsecurity
          - group: runtime
            modules: php,composer nginx,php node python ruby java go dotnet
          # Conflicting engines (mariadb/mysql, redis/valkey) run in separate jobs: a removal keeps their data.
          - group: database
            modules: mariadb postgresql redis nginx,php,mariadb,phpmyadmin caddy,php,adminer apache,postgresql,pgadmin
          - group: database-alt
            modules: mysql valkey mongodb
          # Podman runs inside a test container (its storage on a volume, not on overlayfs). Docker, Portainer and
          # k3s need a kernel of their own (bridges, iptables, cgroups) and run in the VM jobs below.
          - group: container
            modules: podman
          # restic alone (local repository), then the database dumps of every engine; the conflicting engines in a job
          # of their own, as above.
          - group: backup
            modules: restic mariadb,postgresql,redis,restic,db-dumps
          - group: backup-alt
            modules: mysql,valkey,mongodb,restic,db-dumps
          # The Prometheus stack, Grafana below the admin port of nginx, logs from the journal to Loki, Netdata on the
          # WireGuard address (LSS_NETDATA_ACCESS=vpn) and smartd without drives.
          - group: monitoring
            modules: node-exporter prometheus,alertmanager,grafana nginx,prometheus,grafana loki,alloy wireguard,netdata smartd
          - group: network
            modules: wireguard dns-resolver ntp-server
          # mail-relay alone, then with the guard, whose daily summary it delivers to root; the mail server, then with
          # webmail behind nginx. tests/integration/mail-flow.sh sends, receives and checks DKIM, SPF, DMARC and the spam
          # filter without public DNS.
          - group: mail
            modules: mail-relay guard,mail-relay mailserver nginx,php,mailserver,webmail
          # The apps that run without Docker: Self-Updater deploys a Git repository (its own, by tag) and MinIO (Silo)
          # runs from its package behind nginx. The Docker stacks of the other apps run in the apps VM jobs below.
          - group: apps
            modules: node,self-updater nginx,minio
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, verify, reinstall, remove
        env:
          SYSTEM: ${{ matrix.system }}
          MODULES: ${{ matrix.modules }}
        run: |
          read -ra modules <<<"$MODULES"
          tests/integration/run.sh "$SYSTEM" "${modules[@]}"

  host:
    name: ${{ matrix.runner == 'ubuntu-24.04' && 'ubuntu-24.04 VM' || 'ubuntu-24.04 arm64 VM' }} / kernel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, verify, reinstall, remove
        run: tests/integration/run.sh host time swap firewall kernel-hardening mac auditd usbguard wireguard

  profile:
    name: ${{ matrix.runner }} VM / profile minimal-secure
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-26.04 runners are in public preview (October 2026).
        runner: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The whole profile at once, as on a real server, then the Lynis audit. minimal-secure reached a hardening index
      # of 78 here (October 2026); the runner image itself (Docker, PostgreSQL, its sudoers file) costs the rest. The
      # minimum leaves room for small changes between Lynis versions.
      - name: Install the profile, verify, reinstall, audit
        run: tests/integration/run.sh host --profile minimal-secure 75

  vm:
    name: ${{ matrix.system }} VM / ${{ matrix.run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        system: [debian-12, debian-13, rocky-9, almalinux-10]
        run: [kernel, profile minimal-secure]
        # Every module at once (profiles/all.conf), on a clean system without the runner's preinstalled databases: on
        # Debian 13 for every change, on every distribution in the nightly and the manual runs. Docker with Portainer,
        # then k3s (after Docker is removed; they conflict) on every supported system, in a clean VM because the runner
        # already has Docker; minimal-secure on the newest Ubuntu release; the Kubernetes node profile with a Lynis audit;
        # Docker with the monitoring stack and Forgejo, as on a DevOps server; mail, Nextcloud with Collabora Online and
        # Vaultwarden, as on an office server. With the apps, profile all needs most of the memory and processors of
        # the runner.
        include: >-
          ${{ fromJSON(format('[{0},{1}]', '{"system":"debian-12","run":"containers"},{"system":"debian-13","run":"containers"},{"system":"ubuntu-22.04","run":"containers"},{"system":"ubuntu-24.04","run":"containers"},{"system":"ubuntu-26.04","run":"containers"},{"system":"rocky-9","run":"containers"},{"system":"almalinux-10","run":"containers"},{"system":"ubuntu-26.04","run":"profile minimal-secure"},{"system":"debian-13","run":"profile k8s-node"},{"system":"almalinux-10","run":"profile k8s-node"},{"system":"debian-13","run":"profile devops"},{"system":"almalinux-10","run":"profile devops"},{"system":"debian-13","run":"profile office","memory":8192},{"system":"almalinux-10","run":"profile office","memory":8192}',
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '{"system":"debian-12","run":"profile all","memory":12288,"cpus":4,"disk":"40G"},{"system":"debian-13","run":"profile all","memory":12288,"cpus":4,"disk":"40G"},{"system":"rocky-9","run":"profile all","memory":12288,"cpus":4,"disk":"40G"},{"system":"almalinux-10","run":"profile all","memory":12288,"cpus":4,"disk":"40G"},{"system":"ubuntu-22.04","run":"profile all","memory":12288,"cpus":4,"disk":"40G"},{"system":"ubuntu-24.04","run":"profile all","memory":12288,"cpus":4,"disk":"40G"},{"system":"ubuntu-26.04","run":"profile all","memory":12288,"cpus":4,"disk":"40G"}'
          || '{"system":"debian-13","run":"profile all","memory":12288,"cpus":4,"disk":"40G"}')) }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install QEMU and allow access to KVM
        run: |
          # Quiet: errors still reach the log, the man-db trigger and needrestart summaries do not.
          sudo apt-get -qq update
          sudo NEEDRESTART_SUSPEND=1 apt-get -qq install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Kernel modules as on the runner VM, then the whole profile with a Lynis audit. minimal-secure reached a
      # hardening index of 87 on Debian 12 and 85 on Debian 13, 85 on Rocky Linux 9 and 84 on AlmaLinux 10 (October
      # 2026). The minimums leave room for small changes between Lynis versions. Docker and k3s cost points (IP
      # forwarding, Lynis' container checks); the minimums of Ubuntu and of the profiles all and k8s-node are estimates
      # until the first runs.
      - name: Install, verify, reinstall, remove
        env:
          SYSTEM: vm-${{ matrix.system }}
          RUN: ${{ matrix.run }}
          LSS_VM_MEMORY: ${{ matrix.memory || 4096 }}
          LSS_VM_CPUS: ${{ matrix.cpus || 2 }}
          LSS_VM_DISK: ${{ matrix.disk || '20G' }}
        run: |
          if [[ $RUN == kernel ]]; then
            tests/integration/run.sh "$SYSTEM" time swap firewall kernel-hardening mac auditd usbguard wireguard
          elif [[ $RUN == containers ]]; then
            tests/integration/run.sh "$SYSTEM" firewall,docker,portainer firewall,k3s
          else
            case $SYSTEM:$RUN in
            vm-debian-*:"profile minimal-secure") minimum=82 ;;
            vm-rocky-*:"profile minimal-secure" | vm-almalinux-*:"profile minimal-secure") minimum=80 ;;
            *:"profile minimal-secure") minimum=75 ;;
            vm-rocky-*:"profile all" | vm-almalinux-*:"profile all") minimum=80 ;;
            # The same minimum as the host job on the Ubuntu runners.
            vm-debian-* | vm-ubuntu-*) minimum=75 ;;
            *) minimum=60 ;;
            esac
            tests/integration/run.sh "$SYSTEM" --profile "${RUN#profile }" "$minimum"
          fi

  # The apps as Docker Compose stacks behind each web server, on every supported system (x86_64 VMs: Docker needs a
  # kernel of its own). Docker and the web server are the base; each app is installed, used (mod_verify), installed
  # again and removed on its own. Nextcloud alone, then with Collabora Online (Nextcloud Office).
  apps:
    name: ${{ matrix.system }} VM / apps ${{ matrix.set }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        system: [debian-12, debian-13, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, rocky-9, almalinux-10]
        set: [office, dev, web]
        include:
          - set: office
            base: docker,nginx
            modules: nextcloud collabora,nextcloud vaultwarden
          - set: dev
            base: docker,apache
            modules: forgejo uptime-kuma n8n
          - set: web
            base: docker,caddy,tls
            modules: keycloak matomo wordpress minio
            settings: LSS_MINIO_MODE=docker
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install QEMU and allow access to KVM
        run: |
          sudo apt-get -qq update
          sudo NEEDRESTART_SUSPEND=1 apt-get -qq install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, verify, reinstall, remove
        env:
          SYSTEM: vm-${{ matrix.system }}
          BASE: ${{ matrix.base }}
          MODULES: ${{ matrix.modules }}
          LSS_TEST_SETTINGS: ${{ matrix.settings }}
          LSS_VM_MEMORY: 8192
          LSS_VM_CPUS: 4
          LSS_VM_DISK: 40G
        run: |
          read -ra modules <<<"$MODULES"
          tests/integration/run.sh "$SYSTEM" --base "$BASE" "${modules[@]}"

  # The app stacks on arm64. The arm64 runners have no KVM, so the stacks run on the runner itself (host), Ubuntu
  # 24.04: the multi-architecture images, the database containers and the web servers on aarch64. The runner's own
  # Docker goes first, so the docker module sets Docker up as on a fresh server.
  apps-arm64:
    name: ubuntu-24.04 arm64 / apps ${{ matrix.set }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        set: [office, dev, web]
        include:
          - set: office
            base: docker,nginx
            modules: nextcloud collabora,nextcloud vaultwarden
          - set: dev
            base: docker,apache
            modules: forgejo uptime-kuma n8n
          - set: web
            base: docker,caddy,tls
            modules: keycloak matomo wordpress minio
            settings: LSS_MINIO_MODE=docker
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove the runner's Docker
        run: |
          sudo systemctl stop docker.socket docker.service containerd.service 2>/dev/null || true
          mapfile -t packages < <(dpkg-query -W -f "\${Package}\n" 'moby-*' 'docker-*' containerd 'containerd.io' 2>/dev/null)
          [ "${#packages[@]}" -eq 0 ] || sudo NEEDRESTART_SUSPEND=1 apt-get -qq purge -y "${packages[@]}" >/dev/null
          sudo rm -rf /var/lib/docker /var/lib/containerd /etc/docker
      - name: Install, verify, reinstall, remove
        env:
          BASE: ${{ matrix.base }}
          MODULES: ${{ matrix.modules }}
          LSS_TEST_SETTINGS: ${{ matrix.settings }}
        run: |
          read -ra modules <<<"$MODULES"
          tests/integration/run.sh host --base "$BASE" "${modules[@]}"
