# Installs every module on every supported distribution: install, verify, install again without a change, remove.
# Containers run systemd as PID 1; modules that change the kernel (firewall, swap, sysctl, ...) run on the runner
# virtual machine itself, which is thrown away afterwards. Everything runs on x86_64 and on arm64 (aarch64).
name: Integration

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: ${{ matrix.system }}${{ matrix.arch == 'arm64' && ' arm64' || '' }} / ${{ matrix.group }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        system: [debian-12, debian-13, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, rocky-9, almalinux-10]
        group: [base, security, scanners, web, runtime, database, database-alt]
        arch: [x64, arm64]
        include:
          - group: base
            modules: system time admin-user tools logging
          - group: security
            modules: ssh-hardening ssh-2fa fail2ban crowdsec password-policy auto-updates guard
          - group: scanners
            modules: aide rkhunter clamav lynis
          # Each web server alone, then with certificates (Pebble) and sites; then HAProxy.
          - group: web
            modules: nginx,tls,vhost apache,tls,vhost caddy,tls,vhost haproxy nginx,modsecurity apache,modsecurity
          - group: runtime
            modules: php,composer nginx,php node python ruby java go dotnet
          # Conflicting engines (mariadb/mysql, redis/valkey) run in separate jobs: a removal keeps their data.
          - group: database
            modules: mariadb postgresql redis nginx,php,mariadb,phpmyadmin caddy,php,adminer apache,postgresql,pgadmin
          - group: database-alt
            modules: mysql valkey mongodb
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, verify, reinstall, remove
        env:
          SYSTEM: ${{ matrix.system }}
          MODULES: ${{ matrix.modules }}
        run: |
          read -ra modules <<<"$MODULES"
          tests/integration/run.sh "$SYSTEM" "${modules[@]}"

  host:
    name: ${{ matrix.runner == 'ubuntu-24.04' && 'ubuntu-24.04 VM' || 'ubuntu-24.04 arm64 VM' }} / kernel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, verify, reinstall, remove
        run: tests/integration/run.sh host time swap firewall kernel-hardening mac auditd usbguard

  profile:
    name: ${{ matrix.runner }} VM / profile minimal-secure
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-26.04 runners are in public preview (October 2026).
        runner: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The whole profile at once, as on a real server, then the Lynis audit. minimal-secure reached a hardening index
      # of 78 here (October 2026); the runner image itself (Docker, PostgreSQL, its sudoers file) costs the rest. The
      # minimum leaves room for small changes between Lynis versions.
      - name: Install the profile, verify, reinstall, audit
        run: tests/integration/run.sh host --profile minimal-secure 75

  vm:
    name: ${{ matrix.system }} VM / ${{ matrix.run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        system: [debian-12, debian-13, rocky-9, almalinux-10]
        run: [kernel, profile minimal-secure]
        # Every module at once (profiles/all.conf), on a clean system without the runner's preinstalled databases: on
        # Debian 13 for every change, on every distribution in the nightly and the manual runs.
        include: >-
          ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '[{"system":"debian-12","run":"profile all"},{"system":"debian-13","run":"profile all"},{"system":"rocky-9","run":"profile all"},{"system":"almalinux-10","run":"profile all"}]'
          || '[{"system":"debian-13","run":"profile all"}]') }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install QEMU and allow access to KVM
        run: |
          # Quiet: errors still reach the log, the man-db trigger and needrestart summaries do not.
          sudo apt-get -qq update
          sudo NEEDRESTART_SUSPEND=1 apt-get -qq install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Kernel modules as on the runner VM, then the whole profile with a Lynis audit. minimal-secure reached a
      # hardening index of 87 on Debian 12 and 85 on Debian 13, 85 on Rocky Linux 9 and 84 on AlmaLinux 10 (October
      # 2026). The minimums leave room for small changes between Lynis versions.
      - name: Install, verify, reinstall, remove
        env:
          SYSTEM: vm-${{ matrix.system }}
          RUN: ${{ matrix.run }}
        run: |
          if [[ $RUN == kernel ]]; then
            tests/integration/run.sh "$SYSTEM" time swap firewall kernel-hardening mac auditd usbguard
          else
            case $SYSTEM in
            vm-debian-*) minimum=82 ;;
            *) minimum=80 ;;
            esac
            tests/integration/run.sh "$SYSTEM" --profile "${RUN#profile }" "$minimum"
          fi
