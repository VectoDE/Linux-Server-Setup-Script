# Rspamd from its official repositories (https://rspamd.com/downloads.html): one apt suite per release for Debian and
# Ubuntu, centos-9 and centos-10 builds for the RHEL family, x86_64 and aarch64 each. The distributions package no
# Rspamd for the RHEL family and older ones for Debian and Ubuntu; this way every system runs the same version. Key
# https://rspamd.com/apt-stable/gpg.key (the same as https://rspamd.com/rpm/rspamd.asc), fetched on 2026-10-15.
# Rspamd signs the RPM packages and the metadata. The RPM packages need EPEL (libsodium, hyperscan, jemalloc).
KEY=rspamd.asc
FINGERPRINTS=3FA347D5E599BE4595CA2576FFA232EDBF21E25E
DEB_URL=https://rspamd.com/apt-stable/
DEB_SUITE={{codename}}
DEB_COMPONENTS=main
RPM_BASEURL=https://rspamd.com/rpm-stable/centos-{{major}}/$basearch
RPM_GPGCHECK=1
RPM_REPO_GPGCHECK=1
