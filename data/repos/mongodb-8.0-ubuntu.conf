# MongoDB Community 8.0 from the Ubuntu suites of https://repo.mongodb.org. Key fetched from
# https://pgp.mongodb.com/server-8.0.asc on 2026-10-13 (see mongodb-8.0.conf). Debian on arm64 uses these packages
# too: the Debian suites carry amd64 builds only. The jammy build needs glibc 2.35 and libssl3 (bookworm has 2.36 and
# libssl3), the noble build glibc 2.39, libssl3t64 and libcurl4t64 (trixie has 2.41 and both).
KEY=mongodb-8.0.asc
FINGERPRINTS=4B0752C1BCA238C0B4EE14DC41DE058A4E7DCA05
DEB_URL=https://repo.mongodb.org/apt/ubuntu
DEB_SUITE={{codename}}/mongodb-org/8.0
DEB_SUITE_bookworm=jammy/mongodb-org/8.0
DEB_SUITE_trixie=noble/mongodb-org/8.0
# The resolute suite of 8.0 holds no server packages; the noble build runs on Ubuntu 26.04.
DEB_SUITE_resolute=noble/mongodb-org/8.0
DEB_COMPONENTS=multiverse
