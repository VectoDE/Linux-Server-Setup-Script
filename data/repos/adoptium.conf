# Eclipse Temurin (OpenJDK builds of Adoptium, https://adoptium.net/installation/linux/), used only when the
# distribution has no OpenJDK of the version asked for (Debian 12 stops at 17, so the default 21 comes from here).
# Key fetched from https://packages.adoptium.net/artifactory/api/gpg/key/public on 2026-10-13; the apt InRelease files
# and the signed RPM metadata (repomd.xml.asc) verify against it.
KEY=adoptium.asc
FINGERPRINTS=3B04D753C9050D9A5D343F39843C48A565F8F04B
DEB_URL=https://packages.adoptium.net/artifactory/deb
DEB_SUITE={{codename}}
DEB_COMPONENTS=main
RPM_BASEURL=https://packages.adoptium.net/artifactory/rpm/rhel/{{major}}/$basearch
RPM_GPGCHECK=1
RPM_REPO_GPGCHECK=1
