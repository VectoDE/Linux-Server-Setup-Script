# Redis Open Source from https://packages.redis.io, used on RHEL 10, which ships Valkey but no Redis. Key fetched from
# https://packages.redis.io/gpg on 2026-10-13; Redis publishes no fingerprint next to it, the one pinned here is the
# key the RPM packages are signed with. The repository metadata is not signed, so dnf checks the packages instead.
KEY=redis.asc
FINGERPRINTS=54318FA4052D1E61A6B6F7BB5F4349D6BF53AA0C
RPM_BASEURL=https://packages.redis.io/rpm/rockylinux{{major}}
RPM_GPGCHECK=1
RPM_REPO_GPGCHECK=0
