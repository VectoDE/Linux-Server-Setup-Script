# MongoDB Community 9.0 from https://repo.mongodb.org (Debian and the RHEL family; Ubuntu and Debian on arm64 use
# mongodb-9.0-ubuntu). Key fetched from https://pgp.mongodb.com/server-9.asc on 2026-10-13. MongoDB publishes no
# fingerprint next to the key; the one pinned here is the key that signs the Release files and repomd.xml of this
# repository.
KEY=mongodb-9.asc
FINGERPRINTS=B3B42B6C39E5CDDEC0A27E3CF366D55B602E502D
DEB_URL=https://repo.mongodb.org/apt/debian
DEB_SUITE={{codename}}/mongodb-org/9.0
DEB_COMPONENTS=main
RPM_BASEURL=https://repo.mongodb.org/yum/redhat/{{major}}/mongodb-org/9.0/$basearch
RPM_GPGCHECK=1
RPM_REPO_GPGCHECK=1
