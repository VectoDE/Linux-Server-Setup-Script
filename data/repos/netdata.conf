# Netdata from its own stable repository (https://repository.netdata.cloud/repos/stable/): Debian 13, Ubuntu 26.04 and
# EPEL 10 have no Netdata package, so every system uses Netdata's, which gives all of them the same version. Flat apt
# repositories per release (the suite ends in a slash, no components), one rpm repository per RHEL major release, for
# x86_64 and arm64; checked on 2026-10-14 for all seven releases. Keys fetched the same day: the current signing key
# (https://repository.netdata.cloud/netdatabot.gpg.key, the fingerprint Netdata's install guide names) and the previous
# one (netdatabot.old.gpg.key), which still signs the apt InRelease files next to it.
KEY=netdata.asc
FINGERPRINTS=6E155DC153906B73765A74A99DD4A74CECFA8F4F 6588FDD7B14721FE7C3115E6F9177B5265F56346
DEB_URL=https://repository.netdata.cloud/repos/stable/{{id}}/
DEB_SUITE={{codename}}/
DEB_COMPONENTS=
RPM_BASEURL=https://repository.netdata.cloud/repos/stable/el/{{major}}/$basearch/
RPM_GPGCHECK=1
RPM_REPO_GPGCHECK=1
