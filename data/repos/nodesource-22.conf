# Node.js 22.x from NodeSource (https://github.com/nodesource/distributions), one file per major version because
# the major is part of the URL. The "nodistro" builds serve every Debian, Ubuntu and
# RHEL-family release, each for amd64/x86_64 and arm64/aarch64. nodesource.asc holds the apt key
# (https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key) and the RPM key
# (https://rpm.nodesource.com/gpgkey/ns-operations-public.key), both fetched on 2026-10-13 from the URLs NodeSource's
# setup scripts use. NodeSource publishes no fingerprint elsewhere, so they were checked against the signatures of the
# apt repository and of the RPM packages. The RPM metadata is unsigned; the packages are signed.
KEY=nodesource.asc
FINGERPRINTS=6F71F525282841EEDAF851B42F59B5F99B1BE0B4 242B813831AF09562B6C46F76B88DA4E3AF28A14
DEB_URL=https://deb.nodesource.com/node_22.x
DEB_SUITE=nodistro
DEB_COMPONENTS=main
RPM_BASEURL=https://rpm.nodesource.com/pub_22.x/nodistro/nodejs/$basearch
RPM_GPGCHECK=1
RPM_REPO_GPGCHECK=0
