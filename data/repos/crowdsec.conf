# CrowdSec packages from packagecloud (https://packagecloud.io/crowdsec/crowdsec). Key fetched from
# https://packagecloud.io/crowdsec/crowdsec/gpgkey on 2026-10-13. packagecloud signs the repository metadata, not
# the RPM files, so dnf checks the metadata signature (repo_gpgcheck) instead.
KEY=crowdsec.asc
FINGERPRINTS=6A89E3C2303A901A889971D3376ED5326E93CD0C
DEB_URL=https://packagecloud.io/crowdsec/crowdsec/{{id}}
DEB_SUITE={{codename}}
# No trixie suite yet; the bookworm packages are static binaries and run on Debian 13.
DEB_SUITE_trixie=bookworm
DEB_COMPONENTS=main
RPM_BASEURL=https://packagecloud.io/crowdsec/crowdsec/el/{{major}}/$basearch
# The el/10 repository is empty so far; the el/9 packages are static binaries that need only sh, gettext and nftables.
RPM_BASEURL_10=https://packagecloud.io/crowdsec/crowdsec/el/9/$basearch
RPM_GPGCHECK=0
RPM_REPO_GPGCHECK=1
