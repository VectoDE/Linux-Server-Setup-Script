# Microsoft's package repository for Debian (https://learn.microsoft.com/linux/packages), the source of .NET there:
# Debian ships no .NET, Ubuntu and the RHEL family do. It has every supported .NET for amd64 and .NET 10 for arm64.
# Debian 12 is signed with the key "Microsoft (Release signing)", Debian 13 with "Microsoft Corporation - General GPG
# Signer"; microsoft.asc holds both (https://packages.microsoft.com/keys/microsoft.asc and microsoft-2025.asc, fetched
# on 2026-10-13), their fingerprints are the ones Microsoft publishes on the page above.
KEY=microsoft.asc
FINGERPRINTS=BC528686B50D79E339D3721CEB3E94ADBE1229CF AA86F75E427A19DD33346403EE4D7792F748182B
DEB_URL=https://packages.microsoft.com/debian/{{major}}/prod
DEB_SUITE={{codename}}
DEB_COMPONENTS=main
