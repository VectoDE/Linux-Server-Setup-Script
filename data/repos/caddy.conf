# Caddy from its official repositories: Cloudsmith for Debian and Ubuntu (one "any-version" suite for every release,
# key https://dl.cloudsmith.io/public/caddy/stable/gpg.key, matches keyserver.ubuntu.com) and the @caddy COPR for the
# RHEL family (epel-9 and epel-10 builds for x86_64 and aarch64, key
# https://download.copr.fedorainfracloud.org/results/@caddy/caddy/pubkey.gpg). Both fetched on 2026-10-13. COPR signs
# the packages, not the metadata.
KEY=caddy.asc
FINGERPRINTS=65760C51EDEA2017CEA2CA15155B6D79CA56EA34 4A76F92FF6D40440F8FC4F36C52191B1D605147E
DEB_URL=https://dl.cloudsmith.io/public/caddy/stable/deb/debian
DEB_SUITE=any-version
DEB_COMPONENTS=main
RPM_BASEURL=https://download.copr.fedorainfracloud.org/results/@caddy/caddy/epel-{{major}}-$basearch/
RPM_GPGCHECK=1
RPM_REPO_GPGCHECK=0
