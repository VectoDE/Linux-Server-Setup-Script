# MongoDB Community 8.0 from https://repo.mongodb.org (Debian and the RHEL family; Ubuntu and Debian on arm64 use
# mongodb-8.0-ubuntu). Key fetched from https://pgp.mongodb.com/server-8.0.asc on 2026-10-13. MongoDB publishes no
# fingerprint next to the key; the one pinned here is the key that signs the Release files and repomd.xml of this
# repository.
KEY=mongodb-8.0.asc
FINGERPRINTS=4B0752C1BCA238C0B4EE14DC41DE058A4E7DCA05
DEB_URL=https://repo.mongodb.org/apt/debian
DEB_SUITE={{codename}}/mongodb-org/8.0
# The trixie suite of 8.0 holds no server packages; the module takes the noble build from mongodb-8.0-ubuntu there.
DEB_COMPONENTS=main
RPM_BASEURL=https://repo.mongodb.org/yum/redhat/{{major}}/mongodb-org/8.0/$basearch
RPM_GPGCHECK=1
RPM_REPO_GPGCHECK=1
