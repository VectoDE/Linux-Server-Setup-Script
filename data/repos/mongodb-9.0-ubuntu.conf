# MongoDB Community 9.0 from the Ubuntu suites of https://repo.mongodb.org. Key fetched from
# https://pgp.mongodb.com/server-9.asc on 2026-10-13 (see mongodb-9.0.conf). Debian on arm64 uses these packages too:
# the Debian suites carry amd64 builds only. The jammy build needs glibc 2.35 and libssl3 (bookworm has 2.36 and
# libssl3), the noble build glibc 2.39, libssl3t64 and libcurl4t64 (trixie has 2.41 and both).
KEY=mongodb-9.asc
FINGERPRINTS=B3B42B6C39E5CDDEC0A27E3CF366D55B602E502D
DEB_URL=https://repo.mongodb.org/apt/ubuntu
DEB_SUITE={{codename}}/mongodb-org/9.0
DEB_SUITE_bookworm=jammy/mongodb-org/9.0
DEB_SUITE_trixie=noble/mongodb-org/9.0
DEB_COMPONENTS=multiverse
