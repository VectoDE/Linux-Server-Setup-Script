# Supported systems and what lss needs to run on them. One source for the tables "Supported systems" and "System
# requirements" in README.md and for the website: scripts/build-site.sh renders the website from it, and
# `scripts/build-site.sh --check` (run in CI) fails when the README tables say something else.
#
# Fields are separated by "|". Text in backticks is shown as code.
#
#   system|<distribution>|<releases>|<releases tested in CI>
#   arch|<architectures and how CI covers them>
#   requirement|<setup>|<RAM>|<free disk>|<install time>
#   release|<ID>|<name>|<version>|<family>|<end of vendor support>|<extended support>|<extended support until>
#
# The requirement figures come from the RESOURCES lines of the integration jobs (tests/integration/run.sh): the
# largest value across the tested systems, rounded up.

# The release lines are the support matrix lib/os.sh reads: lss runs on exactly these releases and refuses the others.
# <ID> and <version> are matched against ID and VERSION_ID of /etc/os-release, never against a codename: a version with
# a dot (Ubuntu) matches VERSION_ID as it is, the others match its major version. <family> chooses the backends (debian:
# apt; rhel: dnf, yum before release 8; suse: zypper; alpine: apk; arch: pacman). After <end of vendor support> lss
# warns on every run, in lss status and in the guard findings, and names <extended support> (empty: there is none) and
# its end. Dates: the end of free security support from the vendor (Debian: the end of Debian LTS; Ubuntu: the end of
# standard support; RHEL and its rebuilds: the end of the maintenance phase), checked on 2026-11-18 against
# https://wiki.debian.org/LTS, https://ubuntu.com/about/release-cycle,
# https://access.redhat.com/support/policy/updates/errata, https://wiki.rockylinux.org/rocky/version/ and
# https://wiki.almalinux.org/release-notes/ (as collected by https://endoflife.date). Freexian ELTS:
# https://www.freexian.com/lts/extended/.
