# Supported systems and what lss needs to run on them. One source for the tables "Supported systems" and "System
# requirements" in README.md and for the website: scripts/build-site.sh renders the website from it, and
# `scripts/build-site.sh --check` (run in CI) fails when the README tables say something else.
#
# Fields are separated by "|". Text in backticks is shown as code.
#
#   system|<distribution>|<releases>|<releases tested in CI>
#   arch|<architectures and how CI covers them>
#   requirement|<setup>|<RAM>|<free disk>|<install time>
#
# The requirement figures come from the RESOURCES lines of the integration jobs (tests/integration/run.sh): the
# largest value across the tested systems, rounded up.

system|Debian|12, 13|12, 13
system|Ubuntu|22.04, 24.04, 26.04|22.04, 24.04, 26.04
system|Rocky Linux, AlmaLinux, RHEL|9, 10|Rocky 9, AlmaLinux 10

arch|x86_64 and arm64 (aarch64). CI runs on x86_64: on every pull request it installs, verifies, installs again and removes every module on each tested system.

requirement|Profile `minimal-secure`|1 GB; 2 GB on the RHEL family|4 GB|3 to 5 min plus AIDE
requirement|`minimal-secure` with `crowdsec`|1.5 GB; 2 GB on the RHEL family|4.5 GB|about 30 s more
requirement|`minimal-secure` with `clamav`|2.5 GB|4.5 GB|about 1 min more
requirement|Profile `office`|1.5 GB; 2 GB on the RHEL family|10 GB|9 to 16 min
requirement|Profile `devops`|1 GB; 1.5 GB on the RHEL family|7 GB|6 to 11 min
