# The nftables configurations the distributions ship, unchanged (lib/firewall.sh, fw_enable). The nftables service
# loads this file at boot; lss replaces it by one that loads only lss's table when its SHA-256 is listed here, and
# stops with a message when it is not (the administrator changed it).
#
# Fields, separated by spaces: <ID> <version> <file> <sha256>. <ID> is ID of /etc/os-release. <version> matches
# VERSION_ID as it is or as its start up to a dot (3.24 matches 3.24.2); "*" matches every version (rolling releases).
# Each checksum is that of the file in the packaging repository of the distribution, named above its lines with the
# date it was checked. A new package revision that changes the file needs its checksum here.

# Alpine Linux: main/nftables/nftables.nft of aports, branch <version>-stable
# (https://gitlab.alpinelinux.org/alpine/aports/-/raw/3.24-stable/main/nftables/nftables.nft, checked 2026-11-19).
# 3.19 to 3.24 ship the same file. It flushes the whole rule set and drops input with a table "inet filter" of its own
# that has no rule for SSH.
alpine 3.18 /etc/nftables.nft 522638f3f3a86f06ab754f696c620e8a0d3fd8b8094c82a0e373da2cb4f93d2a
alpine 3.19 /etc/nftables.nft e3127d538fc434eed0a22f7acd8534c9f9601a52a101f814c274fe6bd980f918
alpine 3.20 /etc/nftables.nft e3127d538fc434eed0a22f7acd8534c9f9601a52a101f814c274fe6bd980f918
alpine 3.21 /etc/nftables.nft e3127d538fc434eed0a22f7acd8534c9f9601a52a101f814c274fe6bd980f918
alpine 3.22 /etc/nftables.nft e3127d538fc434eed0a22f7acd8534c9f9601a52a101f814c274fe6bd980f918
alpine 3.23 /etc/nftables.nft e3127d538fc434eed0a22f7acd8534c9f9601a52a101f814c274fe6bd980f918
alpine 3.24 /etc/nftables.nft e3127d538fc434eed0a22f7acd8534c9f9601a52a101f814c274fe6bd980f918
# The next release (branch master of aports on 2026-11-19).
alpine 3.25 /etc/nftables.nft 1a1fac08dfba46f2754fb7de4258fd9f3d68b1e131419bc79d25746bf9aec62c

