# Profile: Every module, one choice per conflict group (nginx, fail2ban, mariadb, redis, docker, mailserver)
#
# For the nightly test and as a reference. ssh-2fa, clamav and usbguard stay opt-in as in minimal-secure. k3s
# conflicts with docker (both bring their own containerd and claim the forwarding rules) and has its own profile,
# k8s-node; podman is the alternative to docker. The apps need about 4 GB of memory on top of the rest, and
# self-updater needs the repository it deploys (LSS_SELF_UPDATER_REPO).
LSS_MODULES=system time swap admin-user tools logging ssh-hardening firewall fail2ban kernel-hardening mac auditd auto-updates password-policy aide rkhunter lynis guard nginx tls vhost haproxy modsecurity php composer node python ruby java go dotnet mariadb postgresql redis mongodb phpmyadmin adminer pgadmin docker portainer restic db-dumps wireguard dns-resolver ntp-server mailserver webmail node-exporter prometheus alertmanager grafana loki alloy netdata smartd nextcloud collabora forgejo uptime-kuma vaultwarden keycloak matomo wordpress n8n minio self-updater
