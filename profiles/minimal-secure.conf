# Profile: Hardened base for every server: admin account, SSH keys only, firewall, intrusion bans, auditing, updates, integrity checks, guard
#
# Opt-in on top: ssh-2fa (each user enrols a TOTP app first), clamav (needs about 1.2 GB RAM for its signatures),
# crowdsec instead of fail2ban, usbguard on hardware with USB ports.
LSS_MODULES=system time swap admin-user tools logging ssh-hardening firewall fail2ban kernel-hardening mac auditd auto-updates password-policy aide rkhunter lynis guard
