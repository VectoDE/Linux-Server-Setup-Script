# Profile: DevOps server: minimal-secure plus Docker and the monitoring stack (Prometheus, Alertmanager, Grafana, Loki)
#
# Every interface stays on 127.0.0.1 (SSH tunnel) until LSS_<MODULE>_ACCESS=vpn with the wireguard module or
# LSS_<MODULE>_WEB_ADMIN=true with a web server says otherwise. netdata and restic are opt-in. A Git forge (Forgejo)
# and CI runners join this profile with their modules in a later stage.
LSS_MODULES=system time swap admin-user tools logging ssh-hardening firewall fail2ban kernel-hardening mac auditd auto-updates password-policy aide rkhunter lynis guard docker node-exporter prometheus alertmanager loki alloy grafana smartd
