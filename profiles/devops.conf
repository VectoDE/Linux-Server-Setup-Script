# Profile: DevOps server: minimal-secure plus Docker, the Git forge Forgejo behind nginx and the monitoring stack (Prometheus, Alertmanager, Grafana, Loki)
#
# Every interface stays on 127.0.0.1 (SSH tunnel) until LSS_<MODULE>_ACCESS=vpn with the wireguard module or
# LSS_<MODULE>_WEB_ADMIN=true with a web server says otherwise; Forgejo is the one site on port 443
# (LSS_FORGEJO_DOMAINS, by default forgejo. in front of the server's name). netdata and restic are opt-in.
LSS_MODULES=system time swap admin-user tools logging ssh-hardening firewall fail2ban kernel-hardening mac auditd auto-updates password-policy aide rkhunter lynis guard docker nginx forgejo node-exporter prometheus alertmanager loki alloy grafana smartd
