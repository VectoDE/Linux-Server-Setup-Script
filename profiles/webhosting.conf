# Profile: Web hosting: minimal-secure plus nginx, certificates, PHP, MariaDB, phpMyAdmin and sites
#
# Sites go into LSS_VHOST_SITES, the host names of the server into LSS_TLS_DOMAINS. restic backs up the sites and
# the dumps of MariaDB daily; LSS_RESTIC_REPOSITORY should point to another disk or host.
LSS_MODULES=system time swap admin-user tools logging ssh-hardening firewall fail2ban kernel-hardening mac auditd auto-updates password-policy aide rkhunter lynis guard nginx tls php mariadb phpmyadmin vhost modsecurity restic db-dumps
