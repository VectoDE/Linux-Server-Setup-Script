# Profile: Web hosting: minimal-secure plus nginx, certificates, PHP, MariaDB, phpMyAdmin and sites
#
# Sites go into LSS_VHOST_SITES, the host names of the server into LSS_TLS_DOMAINS. Backups (restic) join the profile
# with the backup modules.
LSS_MODULES=system time swap admin-user tools logging ssh-hardening firewall fail2ban kernel-hardening mac auditd auto-updates password-policy aide rkhunter lynis guard nginx tls php mariadb phpmyadmin vhost modsecurity
