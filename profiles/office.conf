# Profile: Office server: minimal-secure plus a mail server with webmail behind nginx, certificates and backups
#
# LSS_MAILSERVER_DOMAINS (and LSS_MAILSERVER_USERS) must be set; lss prints the DNS records to set and keeps them in
# /etc/lss/mailserver-dns.txt. With LSS_TLS_DOMAINS naming the mail host name, LSS_MAILSERVER_CERTIFICATE=default
# gives Postfix and Dovecot the Let's Encrypt certificate. restic backs up the mailboxes, the DKIM keys and the
# webmail database daily. Nextcloud, Collabora and Vaultwarden join this profile with the application modules.
LSS_MODULES=system time swap admin-user tools logging ssh-hardening firewall fail2ban kernel-hardening mac auditd auto-updates password-policy aide rkhunter lynis guard nginx tls php mailserver webmail restic
