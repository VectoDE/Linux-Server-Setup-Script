# Profile: Office server: minimal-secure plus mail with webmail, Nextcloud with Collabora Online, Vaultwarden, certificates and backups
#
# LSS_MAILSERVER_DOMAINS (and LSS_MAILSERVER_USERS) must be set; lss prints the DNS records to set and keeps them in
# /etc/lss/mailserver-dns.txt. With LSS_TLS_DOMAINS naming the mail host name, LSS_MAILSERVER_CERTIFICATE=default
# gives Postfix and Dovecot the Let's Encrypt certificate. Nextcloud, Collabora Online and Vaultwarden run as Docker
# Compose stacks behind nginx, each on its own host name (LSS_NEXTCLOUD_DOMAINS, LSS_COLLABORA_DOMAINS,
# LSS_VAULTWARDEN_DOMAINS; by default nextcloud., collabora. and vaultwarden. in front of the server's name), which must
# point to the server. restic backs up the mailboxes, the DKIM keys and the webmail database daily.
LSS_MODULES=system time swap admin-user tools logging ssh-hardening firewall fail2ban kernel-hardening mac auditd auto-updates password-policy aide rkhunter lynis guard nginx tls php mailserver webmail docker nextcloud collabora vaultwarden restic
