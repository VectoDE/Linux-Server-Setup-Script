# Profile: Hardened base plus k3s: a single-server Kubernetes node after the k3s CIS hardening guide
#
# The minimal-secure modules and k3s. The Kubernetes API stays on 127.0.0.1 (kubectl through an SSH tunnel) until
# LSS_K3S_API_ACCESS says otherwise; Traefik serves ports 80 and 443 unless LSS_K3S_TRAEFIK=false.
LSS_MODULES=system time swap admin-user tools logging ssh-hardening firewall fail2ban kernel-hardening mac auditd auto-updates password-policy aide rkhunter lynis guard k3s
