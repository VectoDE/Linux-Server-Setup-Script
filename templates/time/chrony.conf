# Managed by lss (module time). Local changes are reported by "lss verify" and replaced on the next run;
# change LSS_TIME_SERVERS or LSS_TIME_NTS instead.
{{TIME_SOURCES}}
driftfile {{TIME_DRIFTFILE}}
ntsdumpdir /var/lib/chrony
makestep 1.0 3
rtcsync
leapsectz right/UTC
logdir /var/log/chrony
# No NTP service for other hosts and no remote command port (chronyc uses the local socket).
port 0
cmdport 0
