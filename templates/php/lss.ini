; Managed by lss (module php). Local changes are reported by "lss verify" and replaced on the next run; change the
; LSS_PHP_* settings in /etc/lss/lss.conf instead. open_basedir is left to each application's pool or virtual host:
; a global one would lock every application into the same directories.

; Tell nobody which PHP runs here, and never show errors to visitors (they go to the log).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; Code is never included from a URL.
allow_url_include = Off
; With nginx, a request for /upload/image.jpg/x.php must not run image.jpg as PHP.
cgi.fix_pathinfo = 0

memory_limit = {{PHP_MEMORY_LIMIT}}
upload_max_filesize = {{PHP_UPLOAD_MAX}}
post_max_size = {{PHP_POST_MAX}}
max_execution_time = 60

; Session cookies only over HTTPS, out of reach of JavaScript, not sent along with cross-site requests, and only
; with IDs the server issued itself.
session.cookie_secure = On
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
