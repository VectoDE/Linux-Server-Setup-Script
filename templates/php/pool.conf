; Managed by lss (module php). Local changes are reported by "lss verify" and replaced on the next run; change the
; LSS_PHP_* settings in /etc/lss/lss.conf instead.
;
; The one PHP-FPM pool of lss. Web servers reach it through the socket, which only root and the group {{WEB_GROUP}}
; may open. The workers run as {{PHP_USER}}, a user without a shell or a home directory.
[lss]
user = {{PHP_USER}}
group = {{PHP_USER}}

listen = {{WEB_PHP_SOCKET}}
listen.owner = root
listen.group = {{WEB_GROUP}}
listen.mode = 0660

; Workers start on demand and stop when idle, so an idle server keeps only the master process.
pm = ondemand
pm.max_children = {{PHP_MAX_CHILDREN}}
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Answers "pong" without running PHP; "lss verify" uses it to prove the pool serves FastCGI requests.
ping.path = {{PHP_PING}}
ping.response = pong

; Only .php files are executed, never an uploaded image with PHP code in it.
security.limit_extensions = .php
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no

; For the web pool only: the command line keeps these functions for composer, cron jobs and queue workers.
{{PHP_DISABLE_LINE}}
php_admin_flag[allow_url_include] = off
php_admin_flag[expose_php] = off

; Sessions of this pool in a directory only its user can read. PHP removes expired ones itself, because the cleanup
; jobs of the distributions know only their own session directory.
php_admin_value[session.save_path] = {{PHP_SESSIONS}}
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 1000
