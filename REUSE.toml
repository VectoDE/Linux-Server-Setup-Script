# Licensing of the files that cannot carry a comment header: documentation, keys, test fixtures, files lss copies to
# servers unchanged, and tool settings. Every script names its license and copyright in its own SPDX header. CI checks
# this with `reuse lint`.
version = 1

[[annotations]]
path = [
  "**/*.md",
  ".gitignore",
  "VERSION",
  ".github/CODEOWNERS",
  ".github/allowed_signers",
  "templates/**",
  "site/lighthouserc.json",
  "tests/fixtures/os-release/**",
]
SPDX-FileCopyrightText = "2025-2026 VectoDE"
SPDX-License-Identifier = "MIT"

# The 1.x install script, kept until 2.0.0 replaces it.
[[annotations]]
path = "install-configure-script.bash"
SPDX-FileCopyrightText = "2025 VectoDE"
SPDX-License-Identifier = "MIT"

# Public signing keys of vendor package repositories, copied unchanged from the vendor so lss can check its packages.
[[annotations]]
path = "data/keys/*.asc"
SPDX-FileCopyrightText = "The vendor named in data/repos/<name>.conf"
SPDX-License-Identifier = "LicenseRef-PublicKey"
