# SonarQube Cloud automatic analysis reads this file: https://sonarcloud.io/project/overview?id=VectoDE_Linux-Server-Setup-Script
sonar.sources=lss,lib,libexec,modules,scripts,install-configure-script.bash
sonar.tests=tests

# Accepted findings, each with its reason.
sonar.issue.ignore.multicriteria=explicitReturn,positional,testRoot

# shelldre:S7682 (explicit return at the end of a function): a Bash function returns the status of its last command.
# Predicates such as state_installed or pkg_is_installed end in a test and rely on that; a trailing "return 0" would
# make them always true. The scripts run with "set -euo pipefail", so a failing command stops the step earlier.
sonar.issue.ignore.multicriteria.explicitReturn.ruleKey=shelldre:S7682
sonar.issue.ignore.multicriteria.explicitReturn.resourceKey=**/*

# shelldre:S7679 (copy positional parameters into locals): the findings are short library helpers with one or two
# arguments that the function name and its comment describe (module_exists NAME, secret_set NAME VALUE).
sonar.issue.ignore.multicriteria.positional.ruleKey=shelldre:S7679
sonar.issue.ignore.multicriteria.positional.resourceKey=**/*

# docker:S6471 (image runs as root): the integration test images boot systemd as PID 1 to stand in for a server, and
# lss configures that server as root. They are never published or run outside the test job.
sonar.issue.ignore.multicriteria.testRoot.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.testRoot.resourceKey=tests/integration/images/**
